# AaaS + Caddy (automatic HTTPS) with Docker.
#   DOMAIN=54-81-208-96.sslip.io docker compose -f deploy/https/docker-compose.https.yml up -d --build
# Open ports 80 and 443 in the EC2 security group (not 3000). Set APP_URL=https://$DOMAIN in .env.
services:
  aaas:
    build: ../..
    restart: unless-stopped
    env_file: ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: https://${DOMAIN}
    volumes:
      - aaas-data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [aaas]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      UPSTREAM: aaas:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  aaas-data:
  caddy-data:
  caddy-config:
