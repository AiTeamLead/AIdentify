<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIdentify · Clinic team</title>
<link rel="stylesheet" href="/clinic-theme.css">
<style>
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font:15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); background:var(--bg); }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.app { display:flex; min-height:100vh; }
.side { width:248px; flex:none; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:18px 6px 14px 12px; position:sticky; top:0; height:100vh; overflow-y:scroll; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#b7c1cd #f1f4f8; }
.side::-webkit-scrollbar { width:10px; }
.side::-webkit-scrollbar-track { background:#f1f4f8; }
.side::-webkit-scrollbar-thumb { background:#b7c1cd; border-radius:10px; border:2px solid #f1f4f8; min-height:40px; }
.side::-webkit-scrollbar-thumb:hover { background:#8f9bab; }
.brand { display:flex; gap:10px; align-items:center; padding:0 8px 16px; }
.mark { width:28px; height:28px; border-radius:8px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; }
.brand b { display:block; font-size:15px; }
.brand span { display:block; color:var(--muted); font-size:12px; font-weight:400; }
.nav { display:flex; flex-direction:column; gap:2px; flex:none; }
.side > * { flex:none; }
.nav button { text-align:left; background:transparent; border:0; border-radius:8px; padding:8px 10px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; }
.nav button[aria-current="page"] { background:var(--soft); color:var(--blue); font-weight:600; }
.nav button:hover { background:#f6f8fb; }
.badge { background:#eef2f6; color:var(--ink); border-radius:99px; font-size:12px; padding:0 7px; min-width:20px; text-align:center; }
.nav button[aria-current="page"] .badge { background:#d7e4ff; color:var(--blue); }
.side .grow { flex:1 0 12px; }
.industry-name { margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#f6f8fb; color:var(--ink); font-size:15px; }
.side select { width:100%; margin-top:4px; border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; font-size:16px; }
.role-switch { display:flex; gap:6px; padding:8px; }
.role-switch button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 4px; font-size:12px; }
.role-switch button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.out { margin:6px 8px 0; background:transparent; border:0; color:var(--muted); text-align:left; padding:6px; }
.main { flex:1; min-width:0; padding:28px 32px 96px; overflow-x:auto; }
.banner { background:var(--amber-bg); color:#6b4700; border:1px solid #f3e2c0; border-radius:10px; padding:10px 12px; margin-bottom:16px; font-size:13px; }
h1 { font-size:26px; letter-spacing:-.03em; margin:0 0 4px; font-weight:650; }
.sub { color:var(--muted); margin:0 0 18px; }
.callout { background:#fff; border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
.kpis, .team, .split, .days { display:grid; gap:12px; }
.kpis { grid-template-columns:repeat(auto-fit, minmax(148px, 1fr)); margin-bottom:18px; }
.team { grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); }
.card, .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.tile { padding:14px; }
.tile .k { color:var(--muted); font-size:13px; }
.tile .v { font-size:26px; font-weight:650; letter-spacing:-.03em; margin-top:4px; }
.tile .hint { color:var(--muted); font-size:12px; margin-top:4px; }
.team button.tile { width:100%; text-align:left; }
.team button.tile:hover { border-color:#c9d7f5; }
.muted { color:var(--muted); }
.small { font-size:13px; color:var(--muted); }
h2 { font-size:16px; margin:22px 0 8px; }
table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; background:#fafbfc; }
tr:last-child td { border-bottom:0; }
.scroll { max-height:440px; overflow:auto; border-radius:12px; }
.pill { display:inline-block; border-radius:99px; padding:2px 8px; font-size:12px; background:#eef2f6; }
.pill.new, .pill.pending, .pill.draft, .pill.queued { background:#fff6e5; color:var(--amber); }
.pill.booked, .pill.scheduled, .pill.approved, .pill.completed { background:var(--green-bg); color:var(--green); }
.pill.noshow, .pill.rejected, .pill.cancelled, .pill.closed, .pill.overdue { background:var(--red-bg); color:var(--red); }
.pill.paid { background:var(--green-bg); color:var(--green); }
.pill.unpaid { background:var(--amber-bg); color:var(--amber); }
.btn, .btn-ghost, .btn-danger { border-radius:8px; padding:8px 12px; border:1px solid transparent; }
.btn { background:var(--blue); color:#fff; }
.btn:hover { background:var(--blue-d); }
.btn-ghost { background:#fff; border-color:var(--line); }
.ai-box { border:1px solid var(--line); border-radius:12px; padding:12px 14px 4px; margin:6px 0 0; display:grid; gap:10px; min-width:0; }
.ai-box legend { font-weight:650; font-size:13px; padding:0 6px; }
.model-other[hidden], .ai-load-msg[hidden], .biz-other[hidden] { display:none !important; }
.ai-box select { width:100%; }
select[aria-busy="true"] { cursor:progress; }
.btn-danger { background:#fff; border-color:#f0d0d0; color:var(--red); }
.btn:disabled, .btn-ghost:disabled { opacity:.5; cursor:not-allowed; }
.row-actions { display:flex; gap:6px; flex-wrap:wrap; }
.form { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:10px 0 16px; }
.form label, .stack label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
.form input, .form select, .form textarea, .stack input, .stack select, .stack textarea { border:1px solid #d5dbe3; border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
.password-input { position:relative; }
.stack .password-input input { padding-right:42px; }
.password-toggle { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:grid; place-items:center; padding:6px; border:0; background:transparent; color:var(--muted); }
.password-toggle:hover { color:var(--ink); }
.password-toggle svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.password-toggle .eye-slash { display:none; }
.password-toggle[aria-pressed="true"] .eye-slash { display:block; }
.auth-divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
.auth-divider::before, .auth-divider::after { content:""; flex:1; height:1px; background:var(--line); }
.google-signin { display:flex; align-items:center; justify-content:center; gap:9px; text-decoration:none; }
.google-mark { font-size:19px; line-height:1; font-weight:700; color:#4285f4; }
.form .wide { grid-column:span 2; }
.form .full { grid-column:1 / -1; }
.split { grid-template-columns:1fr 1fr; align-items:start; }
.days { grid-template-columns:repeat(7, minmax(0,1fr)); }
.day { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; min-height:140px; }
.day b { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
.cal-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.cal-head b { font-size:16px; min-width:150px; text-align:center; }
.cal-src { margin-left:auto; }
.cal { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; }
.cal-w { font-size:12px; font-weight:650; color:var(--muted); padding:0 4px; }
.cal-cell { background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px; min-height:96px; display:flex; flex-direction:column; gap:4px; min-width:0; }
.cal-cell.blank { background:transparent; border:0; }
.cal-cell.today { border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
.cal-d { font-size:12px; font-weight:650; color:var(--muted); }
.cal-cell.today .cal-d { color:var(--blue); }
.fest { text-align:left; font-size:11.5px; line-height:1.3; border:0; border-radius:6px; padding:4px 6px; background:#fff4e0; color:#7a4b00; cursor:pointer; overflow-wrap:anywhere; }
.fest.pub { background:#ffe9e4; color:#8a2a12; }
.fest:hover, .fest:focus-visible { filter:brightness(.96); outline:2px solid var(--blue); outline-offset:1px; }
.fest-h { margin:18px 0 8px; font-size:15px; }
.fest-list { display:grid; gap:8px; margin-bottom:8px; }
.fest-row { display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
@media (max-width:720px) { .cal { gap:3px; } .cal-cell { min-height:64px; padding:4px; } .cal-w { font-size:10px; } .fest { font-size:10px; padding:2px 4px; } .cal-cell .post { display:none; } .cal-src { margin-left:0; width:100%; } }
.post { font-size:12px; background:#f6f8fb; border-radius:8px; padding:6px; margin-top:6px; }
.draft { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
.draft p { margin:6px 0; white-space:pre-wrap; }
.rules { margin-top:16px; }
.auth { min-height:100vh; display:grid; place-items:center; padding:24px; }
.domains { margin:18px 0; display:grid; gap:8px; }
.domains > b { font-size:14px; }
.dom-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; }
.dom { display:flex; flex-direction:column; gap:2px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); text-decoration:none; }
.dom:hover, .dom:focus-visible { border-color:var(--blue); background:#f6f8fb; }
.dom span { font-weight:600; font-size:14px; }
.dom code { font-size:12px; color:var(--muted); }
.dom-badge { justify-self:start; width:max-content; }
.landing { min-height:100vh; display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:center; padding:32px 6vw; }
.hero h1 { font-size:40px; letter-spacing:-.04em; line-height:1.1; }
.plans { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; margin-top:16px; }
.banner.ended { background:#fde8e8; color:#8a1f1f; border-color:#f3c7c7; }
.recovered { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin:8px 0 16px; }
.recovered .v { font-size:40px; font-weight:650; letter-spacing:-.03em; }
.recovered ul { display:flex; flex-wrap:wrap; gap:8px 18px; margin:10px 0 0; padding:0; list-style:none; }
.banner .btn { margin:8px 8px 0 0; }
.panel { width:min(440px, 100%); background:#fff; border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:var(--shadow); }
.panel h1 { font-size:28px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.tabs { display:flex; gap:6px; margin-bottom:12px; }
.tabs button { flex:1; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px; }
.tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.err { color:var(--red); font-size:13px; min-height:1.2em; }
.roles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.roles button { text-align:left; padding:16px; }
.roles ul { margin:8px 0 0; padding-left:18px; color:var(--muted); }
.bot-sw { position:fixed; top:10px; right:12px; z-index:40; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); box-shadow:var(--shadow); font-size:13px; font-weight:650; }
.bot-sw i { width:18px; height:18px; border-radius:50%; background:#c5ced8; display:inline-block; }
.bot-sw.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.bot-sw.on i { background:#fff; }
.bot-on { min-height:100vh; }
.bot-frame { position:fixed; inset:0; width:100%; height:100%; height:100dvh; border:0; background:var(--bg); z-index:8; }
.chief { display:flex; flex-direction:column; height:calc(100vh - 28px); height:calc(100dvh - 28px); background:#fff; overflow:hidden; }
.chief header { padding:18px 22px; border-bottom:1px solid var(--line); }
.chief header b { display:block; font-size:20px; }
.chief header span { color:var(--muted); font-size:13px; }
.chief .log { flex:1; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:12px; }
.chief form { display:flex; gap:8px; padding:14px; border-top:1px solid var(--line); }
.chief input { flex:1; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:16px; }
.home-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; align-items:start; }
.drawer-back { position:fixed; inset:0; background:rgba(23,24,43,.28); z-index:30; }
.drawer { position:fixed; top:0; right:0; height:100%; width:min(420px, 100%); z-index:31; padding:20px; overflow:auto; border-radius:0; }
@media (max-width:800px) { .home-grid { grid-template-columns:1fr; } .chief { height:calc(100dvh - 12px); } }
.chat-fab { position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff; border:0; border-radius:999px; padding:12px 16px; box-shadow:0 8px 24px rgba(16,24,40,.18); z-index:5; }
.chat-fab.bot { display:inline-flex; align-items:center; gap:8px; padding:10px 16px 10px 12px; font-weight:650; }
.chat-fab.bot .robot { width:22px; height:22px; }
.chat-fab.bot.open { opacity:0; pointer-events:none; }
.chief-mini { position:fixed; right:20px; bottom:20px; width:min(400px, calc(100vw - 32px)); height:min(620px, calc(100vh - 100px)); background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 24px 60px rgba(16,24,40,.22); display:flex; flex-direction:column; overflow:hidden; z-index:30; transform-origin:bottom right; animation:miniIn .18s ease-out; }
.chief-mini[hidden] { display:none; }
.chief-mini.full { inset:0; right:0; bottom:0; left:0; top:0; width:100vw; height:100vh; height:100dvh; border:0; border-radius:0; z-index:60; animation:none; }
.chief-mini header { display:flex; align-items:center; gap:10px; padding:10px 10px 10px 14px; background:var(--ink); color:#fff; }
.chief-mini header .ava { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.14); flex:none; }
.chief-mini header .t { flex:1; min-width:0; display:grid; line-height:1.2; }
.chief-mini header .t b { font-size:14px; }
.chief-mini header .t span { font-size:11.5px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chief-mini header button { width:32px; height:32px; border:0; border-radius:8px; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; padding:0; }
.chief-mini header button:hover { background:rgba(255,255,255,.14); }
.chief-mini iframe { flex:1; width:100%; border:0; background:#fff; }
@keyframes miniIn { from { opacity:0; transform:scale(.94) translateY(8px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .chief-mini { animation:none; } }
.chat { position:fixed; right:20px; bottom:72px; width:min(360px, calc(100vw - 32px)); height:460px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 16px 40px rgba(16,24,40,.16); display:flex; flex-direction:column; z-index:5; }
.chat header { padding:12px 14px; border-bottom:1px solid var(--line); font-weight:650; }
.chat .log { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.bubble { border-radius:12px; padding:8px 10px; max-width:95%; white-space:pre-wrap; }
.bubble.u { align-self:flex-end; background:var(--soft); }
.bubble.a { align-self:flex-start; background:#f6f8fb; }
.chat form { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
.chat input { flex:1; min-width:0; border:1px solid #d5dbe3; border-radius:8px; padding:8px 10px; font-size:16px; }
.chat form .btn { flex:none; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1b2430; color:#fff; padding:10px 14px; border-radius:10px; z-index:6; max-width:min(480px, calc(100vw - 24px)); }
.link { color:var(--blue); }
.guide ul { margin:4px 0 6px 18px; padding:0; } .guide ul li { margin:2px 0; font-weight:400; } .guide li p { margin:3px 0; }
button.link { background:none; border:0; padding:0; font:inherit; cursor:pointer; text-align:left; }
.notice { background:#fff8e6; border:1px solid #f1dca0; border-radius:10px; padding:10px 12px; font-size:13.5px; }
.stack label.check, label.check { display:flex; flex-direction:row; gap:8px; align-items:center; font-size:13.5px; } label.check input { width:auto; margin:0; }
.placeholder { opacity:.85; }
.conn { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.conn .actions { display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex:none; }
.src { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
.src li { background:#f6f8fb; border-radius:999px; padding:4px 10px; font-size:13px; }
.visit-q { margin:0 0 12px; }
.terms { margin:8px 0 0; padding-left:18px; }
.scroll { overflow:auto; -webkit-overflow-scrolling:touch; }
table { min-width:520px; }
@media (max-width:1100px) {
  .days, .split, .form, .roles, .plans { grid-template-columns:1fr 1fr; }
  .side { width:220px; }
  .landing { grid-template-columns:1fr; padding:24px 16px 40px; }
  .hero h1 { font-size:32px; }
  .panel { width:min(560px, 100%); }
}
@media (max-width:800px) {
  .app { flex-direction:column; }
  .side { width:auto; height:auto; position:relative; border-right:0; border-bottom:1px solid var(--line); padding:12px 10px 8px; }
  .nav { flex-direction:row; overflow:auto; gap:4px; padding-bottom:4px; flex:none; margin:0; padding:0 0 4px; }
  .side { overflow:visible; }
  .nav button { white-space:nowrap; flex:none; min-height:40px; }
  .brand span { max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .role-switch { flex-wrap:wrap; }
  .days, .roles { grid-template-columns:1fr 1fr; }
  .split, .form, .plans, .agent-kpis { grid-template-columns:1fr !important; }
  .main { padding:16px 14px 108px; }
  .side .grow { display:none; }
  h1 { font-size:22px; }
  .hero h1 { font-size:30px; }
  .tile .v { font-size:22px; }
  .form input, .form select, .form textarea, .stack input, .stack select, .stack textarea { font-size:16px; }
  .conn { flex-direction:column; }
  .conn .actions { align-items:flex-start; flex-direction:row; flex-wrap:wrap; }
  .chat { left:8px; right:8px; width:auto; height:min(70vh, 520px); bottom:64px; }
  .bot-sw { top:8px; right:8px; }
  .chat-fab { right:12px; bottom:12px; min-height:44px; }
  .chief-mini { right:8px; left:8px; bottom:8px; width:auto; height:min(78vh, 620px); }
  .auth { padding:12px; align-items:start; }
  .landing { padding:16px 12px 32px; gap:16px; }
}
@media (max-width:480px) {
  .days, .roles, .plans { grid-template-columns:1fr; }
  .hero h1 { font-size:26px; }
  .panel { padding:18px 14px; }
  th, td { padding:8px; }
}

/* ---------- onboarding (Typeform-style, fits the screen) ---------- */
.ob { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr; background:var(--bg); overflow:hidden; }
.ob-bar { position:absolute; top:0; left:0; right:0; height:4px; background:rgba(47,42,134,.10); z-index:3; }
.ob-bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, #10b981, #2f2a86); border-radius:0 4px 4px 0; transition:width .45s cubic-bezier(.2,.7,.2,1); }
.ob-head { position:relative; padding:clamp(14px, 2.6vh, 26px) clamp(20px, 4vw, 56px) clamp(14px, 2.4vh, 24px); background:#f7f7f9; border-bottom:1px solid #e9eaf2;
  background-image:radial-gradient(#dcdfeb 1px, transparent 1px); background-size:18px 18px; }
.ob-headrow { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.ob-brand .mark { background:var(--primary); color:#fff; }
.ob-h { font-size:clamp(24px, 2.6vw, 34px); line-height:1.15; letter-spacing:-.02em; margin:clamp(8px, 1.6vh, 16px) 0 4px; color:var(--ink); }
.ob-h span { background:linear-gradient(90deg, #2f2a86, #0e8f62); -webkit-background-clip:text; background-clip:text; color:transparent; }
.ob-lead { margin:0; color:var(--muted); font-size:14.5px; line-height:1.5; max-width:720px; }
.ob-foot { margin:0; font-size:13px; color:var(--muted); }
.ob-link { background:none; border:0; padding:0; color:var(--primary); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:13px; }
/* horizontal flow: node cards joined by lines (grey dotted → green when right, red when something needs fixing) */
