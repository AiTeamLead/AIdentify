# SonarQube settings for AIdentify (read by sonar-scanner in Jenkins).
# Keep sonar.projectKey the same as the project in SonarQube (Jenkins may also pass -Dsonar.projectKey=...).
sonar.projectKey=AIdentify
sonar.projectName=AIdentify
sonar.sourceEncoding=UTF-8

# What is source code and what is tests
sonar.sources=.
sonar.tests=test
sonar.exclusions=node_modules/**,coverage/**,data/**,public/**,zips/**,.vercel/**,test/**
sonar.test.inclusions=test/**

# Coverage: written by "npm run test:coverage" (c8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Not counted for coverage (still scanned for bugs and security issues):
# - code that runs in the browser, the phone/desktop apps, or as one-off admin commands (scripts/)
# - adapters that only work against a real outside runtime: a real Chrome (browser.js, remote-browser.js,
#   xbrowser.js), Slack's live socket (slack.js), the build sandbox processes (factory.js) and the cloudflared
#   tunnel (media-tunnel.js). Their logic is exercised by the browser end-to-end suites, not by npm test.
sonar.coverage.exclusions=**/*.html,home.js,landing-v2.js,clients/**,scripts/**,docs/**,deploy/**,test/**,lib/browser.js,lib/remote-browser.js,lib/xbrowser.js,lib/slack.js,lib/factory.js,lib/media-tunnel.js
